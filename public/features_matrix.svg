<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Styling & Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes growBar {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      @keyframes writeMessage {
        0%, 100% { opacity: 0; transform: translateY(5px); }
        5%, 95% { opacity: 1; transform: translateY(0px); }
      }
      .panel-bg {
        fill: #18181b;
        stroke: #27272a;
        stroke-width: 1.5;
        rx: 8;
      }
      .panel-header {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #a1a1aa;
        letter-spacing: 1.5px;
      }
      .panel-body {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        fill: #ffffff;
      }
      .panel-desc {
        font-family: 'Inter', sans-serif;
        font-size: 10px;
        fill: #71717a;
      }
      
      /* Panel 1 animations */
      .anim-circle { transform-origin: center; animation: pulse 2s infinite ease-in-out; }
      .circle-1 { animation-delay: 0s; }
      .circle-2 { animation-delay: 0.5s; }
      .circle-3 { animation-delay: 1s; }
      
      /* Panel 2 animations */
      .risk-bar {
        animation: growBar 3s cubic-bezier(0.1, 0.8, 0.2, 1) infinite alternate;
        transform-origin: left;
      }
      .danger-dot { animation: pulse 1s infinite alternate; }

      /* Panel 3 animations */
      .chat-msg-1 { animation: writeMessage 8s infinite; animation-delay: 0s; opacity: 0; }
      .chat-msg-2 { animation: writeMessage 8s infinite; animation-delay: 2.2s; opacity: 0; }
      .chat-msg-3 { animation: writeMessage 8s infinite; animation-delay: 4.8s; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

  <!-- Panel 1: Code Mapping -->
  <g transform="translate(25, 30)">
    <rect width="230" height="180" class="panel-bg"/>
    <text x="15" y="25" class="panel-header">CODE ARCHITECTURE</text>
    
    <!-- Code tree visualization -->
    <g transform="translate(20, 40)">
      <!-- Tree lines -->
      <line x1="20" y1="25" x2="60" y2="45" stroke="#27272a" stroke-width="1.5" />
      <line x1="20" y1="25" x2="60" y2="85" stroke="#27272a" stroke-width="1.5" />
      <line x1="60" y1="45" x2="110" y2="35" stroke="#27272a" stroke-width="1.5" />
      <line x1="60" y1="45" x2="110" y2="60" stroke="#27272a" stroke-width="1.5" />
      
      <!-- Nodes -->
      <circle cx="20" cy="25" r="7" fill="#6366f1" class="anim-circle circle-1" />
      <circle cx="60" cy="45" r="5" fill="#a855f7" class="anim-circle circle-2" />
      <circle cx="60" cy="85" r="5" fill="#a855f7" class="anim-circle circle-3" />
      <circle cx="110" cy="35" r="3" fill="#ffffff" />
      <circle cx="110" cy="60" r="3" fill="#ffffff" />
      
      <text x="32" y="20" class="panel-desc">app/</text>
      <text x="72" y="49" class="panel-desc">api/analyze</text>
      <text x="72" y="89" class="panel-desc">components/</text>
    </g>
    <text x="15" y="150" class="panel-body">Repository Mapping</text>
    <text x="15" y="163" class="panel-desc">Parses file layouts &amp; code trees</text>
  </g>

  <!-- Panel 2: Dependency Risk -->
  <g transform="translate(285, 30)">
    <rect width="230" height="180" class="panel-bg" style="stroke: #ef4444; stroke-opacity: 0.3;" />
    <text x="15" y="25" class="panel-header" style="fill: #f87171;">SECURITY AUDIT</text>
    
    <!-- Risk Meter & Packages -->
    <g transform="translate(20, 45)" font-family="monospace">
      <text x="0" y="10" fill="#a1a1aa" font-size="10px">@babel/traverse</text>
      <circle cx="150" cy="7" r="4.5" fill="#f87171" class="danger-dot" />
      <text x="160" y="10" fill="#f87171" font-size="9px">HIGH RISK</text>
      
      <text x="0" y="30" fill="#a1a1aa" font-size="10px">mongoose</text>
      <circle cx="150" cy="27" r="4.5" fill="#34d399" />
      <text x="160" y="30" fill="#34d399" font-size="9px">SECURE</text>
      
      <!-- Progress/Risk Bar -->
      <text x="0" y="65" fill="#ffffff" font-size="11px" font-family="sans-serif" font-weight="700">Threat Scope</text>
      <rect x="0" y="75" width="190" height="8" rx="4" fill="#27272a" />
      <rect x="0" y="75" width="142" height="8" rx="4" fill="#ef4444" class="risk-bar" />
    </g>
    
    <text x="15" y="150" class="panel-body">Dependency Auditor</text>
    <text x="15" y="163" class="panel-desc">Flags packages &amp; suggests patches</text>
  </g>

  <!-- Panel 3: AI Chat -->
  <g transform="translate(545, 30)">
    <rect width="230" height="180" class="panel-bg" style="stroke: #a855f7; stroke-opacity: 0.3;" />
    <text x="15" y="25" class="panel-header" style="fill: #c084fc;">CONVERSATIONAL AI</text>
    
    <!-- Chat Drawer Simulation with wrapper positioning -->
    <g transform="translate(15, 45)">
      <!-- Chat bubbles -->
      <g transform="translate(0, 0)">
        <g class="chat-msg-1">
          <rect x="0" y="0" width="160" height="24" rx="4" fill="#27272a" />
          <text x="10" y="15" fill="#e4e4e7" font-size="10px">Where is the entry point?</text>
        </g>
      </g>
      
      <g transform="translate(20, 32)">
        <g class="chat-msg-2">
          <rect x="0" y="0" width="180" height="34" rx="4" fill="#4c1d95" />
          <text x="10" y="15" fill="#f3e8ff" font-size="9px" font-weight="600">The main entry is located</text>
          <text x="10" y="25" fill="#f3e8ff" font-size="9px" font-weight="600">inside app/page.tsx</text>
        </g>
      </g>

      <g transform="translate(0, 72)">
        <g class="chat-msg-3">
          <rect x="0" y="0" width="140" height="20" rx="4" fill="#27272a" />
          <text x="10" y="13" fill="#e4e4e7" font-size="9px">Thanks! How do I run it?</text>
        </g>
      </g>
    </g>
    
    <text x="15" y="150" class="panel-body">Conversational Agent</text>
    <text x="15" y="163" class="panel-desc">Interactive QA on repo architecture</text>
  </g>
</svg>
