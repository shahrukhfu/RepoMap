<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <!-- Code map path lines -->
  <line x1="8" y1="10" x2="24" y2="10" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="2 1"/>
  <line x1="8" y1="10" x2="16" y2="24" stroke="#a855f7" stroke-width="1.8"/>
  <line x1="24" y1="10" x2="16" y2="24" stroke="#6366f1" stroke-width="1.8"/>
  <!-- Map Nodes -->
  <circle cx="8" cy="10" r="3.5" fill="#6366f1"/>
  <circle cx="24" cy="10" r="3.5" fill="#a855f7"/>
  <circle cx="16" cy="24" r="4.5" fill="#ffffff"/>
  <circle cx="16" cy="24" r="2" fill="#6366f1"/>
</svg>
